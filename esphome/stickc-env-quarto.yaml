              - obj:
                  styles: box_style
                  x: 0
                  y: 30
                  width: 240
                  height: 29
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 6
                        text_font: font_label14
                        text: "Gás"
                    - label:
                        id: p2_gas
                        align: RIGHT_MID
                        x: -6
                        text_font: font_val22
                        text: "-- kΩ"
              - obj:
                  styles: box_style
                  x: 0
                  y: 59
                  width: 240
                  height: 30
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 6
                        text_font: font_label14
