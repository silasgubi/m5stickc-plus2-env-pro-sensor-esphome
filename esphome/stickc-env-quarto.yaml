                width: 2
                height: 4
                radius: 1
                pad_all: 0
                border_width: 0
                bg_color: 0x57D97C
            - obj:
                id: status_rule
                x: 0
                y: 16
                width: 240
                height: 1
                radius: 0
                pad_all: 0
                border_width: 0
                bg_color: 0x57D97C
