# --- Red LED blink while IAQ is "Ruim" (iaq_alert_active,
# set in the main interval below). Own interval (500ms), separate
# from the screen's 10s one, just so the blink logic is not coupled to the update of the
# sensors. The "Aviso Luminoso Qualidade Ar" switch (iaq_led_enabled) turns it off. ---
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(iaq_alert_active);'
              - switch.is_on: iaq_led_enabled
          then:
            - lambda: 'id(alert_led_state) = !id(alert_led_state);'
            - if:
                condition:
                  lambda: 'return id(alert_led_state);'
                then:
                  - output.turn_on: alert_led_out
                else:
                  - output.turn_off: alert_led_out
          else:
            - output.turn_off: alert_led_out
            - lambda: 'id(alert_led_state) = false;'
      # Page 3 cursor blink (same 500 ms tick).
      - if:
          condition:
            lambda: 'return id(current_page) == 3;'
          then:
            - lambda: 'id(cursor_blink_on) = !id(cursor_blink_on);'
            - script.execute: update_config_screen

  # --- Screen refresh (10s, reduced from 5s/1s for stability, see
  # docs/lessons-learned.md on screen freezes after days of uptime). Updates all pages,
  # including the hidden ones, so a page switch never shows stale values. ---
  - interval: 10s
    then:
      - lvgl.label.update:
          id: p1_temp
          text: !lambda |-
            if (id(env_temperature).has_state())
              return str_sprintf("%.1f°C", id(env_temperature).state);
            return std::string("--.-°C");
      - lvgl.label.update:
          id: p1_hum
          text: !lambda |-
            if (id(env_humidity).has_state())
              return str_sprintf("%.0f%%", id(env_humidity).state);
            return std::string("--%");
      - lvgl.label.update:
          id: p1_air
          text: !lambda |-
            if (id(env_iaq).has_state()) {
              float v = id(env_iaq).state;
              if (v < 100) return std::string("Bom");
              if (v < 200) return std::string("Médio");
              return std::string("Ruim");
            }
            return std::string("---");
      - lvgl.label.update:
          id: p2_press
          text: !lambda |-
            if (id(env_pressure).has_state())
              return str_sprintf("%.0f hPa", id(env_pressure).state);
            return std::string("--- hPa");
      - lvgl.label.update:
          id: p2_gas
          text: !lambda |-
            if (id(env_gas_resistance).has_state())
              return str_sprintf("%.0f kΩ", id(env_gas_resistance).state / 1000.0f);
            return std::string("-- kΩ");
      - lvgl.label.update:
          id: p2_iaq
          text: !lambda |-
            if (id(env_iaq).has_state())
              return str_sprintf("%.0f", id(env_iaq).state);
            return std::string("---");
      # BSEC2 accuracy text translated for the screen (Home Assistant keeps
      # the original English state).
      - lvgl.label.update:
          id: p2_acc
          text: !lambda |-
            if (!id(env_iaq_accuracy).has_state()) return std::string("---");
            std::string a = id(env_iaq_accuracy).state;
            if (a == "Stabilizing") return std::string("Estabilizando");
            if (a == "Uncertain") return std::string("Incerto");
            if (a == "Calibrating") return std::string("Calibrando");
            if (a == "Calibrated") return std::string("Calibrado");
            return a;
      # Alert beep only on the TRANSITION to "Ruim" (does not repeat all the time
      # while the air stays bad); resets when it improves again.
      - if:
          condition:
            lambda: |-
              return id(env_iaq).has_state() && id(env_iaq).state >= 200 && !id(iaq_alert_active);
          then:
            - globals.set:
                id: iaq_alert_active
                value: "true"
            - if:
                condition:
                  switch.is_on: iaq_beep_enabled
                then:
                  - script.execute:
                      id: beep
                      freq: 2500
                      dur_ms: 600
      - if:
          condition:
            lambda: |-
              return id(env_iaq).has_state() && id(env_iaq).state < 200 && id(iaq_alert_active);
          then:
            - globals.set:
                id: iaq_alert_active
                value: "false"
      - lvgl.label.update:
          id: batt_pct
          text: !lambda |-
            if (id(battery_percent).has_state())
              return str_sprintf("%.0f%%", id(battery_percent).state);
            return std::string("--%");
      - lvgl.obj.update:
          id: batt_fill
          width: !lambda |-
            if (!id(battery_percent).has_state()) return 1;
            int w = (int) roundf(12.0f * id(battery_percent).state / 100.0f);
            return w < 1 ? 1 : w;
