            id: p1_box
            styles: box_style
            x: 0
            y: 17
            width: 240
            height: 118
            scrollable: false
            widgets:
              - obj:
                  styles: box_style
                  x: 0
                  y: 0
                  width: 240
                  height: 39
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 6
                        text_font: font_label14
