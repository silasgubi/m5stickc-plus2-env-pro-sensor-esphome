                        text: "---"

    # Page 2: pressure, gas resistance, IAQ, IAQ accuracy.
    - id: page_details
      widgets:
        - obj:
            id: p2_box
            styles: box_style
            x: 0
            y: 17
            width: 240
            height: 118
            scrollable: false
            widgets:
              - obj:
                  styles: box_style
                  x: 0
